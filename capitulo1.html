<html lang="pt-BR">

<title>O Celular da Helena</title>
<style>
:root{
  --bg:#0d1416; --ink:#e9efee; --dim:#8a9a9a; --panel:#152024; --panel2:#1d2b30;
  --accent:#7fd1c7; --accent-dim:#3f7f78; --alert:#d1665a; --me:#24524d; --them:#1f2d33;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at top,#16242a 0%,#070b0c 70%);display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);padding:24px 12px;}
.frame{width:100%;max-width:380px;height:800px;background:#000;border-radius:44px;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.7),inset 0 0 0 2px #2a2a2a;}
.screen{width:100%;height:100%;background:var(--bg);border-radius:32px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:22px;background:#000;border-radius:0 0 16px 16px;z-index:60;}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:70px;background:linear-gradient(170deg,#1b3038 0%,#0d1416 65%);z-index:50;transition:transform .35s ease;}
.lock.hidden{transform:translateY(-100%);}
.lock .time{font-size:58px;font-weight:600;letter-spacing:-1px;}
.lock .date{font-size:15px;color:var(--dim);margin-top:4px;}
.lock .warn{margin-top:26px;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px;font-size:12px;color:var(--dim);width:82%;line-height:1.5;}
.lock .hint{margin-top:auto;margin-bottom:30px;font-size:12.5px;color:var(--dim);text-align:center;padding:0 30px;}
.btn{padding:13px 24px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:20px;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit;}
.home{flex:1;display:flex;flex-direction:column;padding:46px 18px 14px;overflow-y:auto;}
.status{font-size:12px;color:var(--dim);text-align:center;}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;margin-top:18px;}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;color:var(--ink);font-family:inherit;cursor:pointer;}
.icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;position:relative;background:var(--panel2);}
.badge{position:absolute;top:-4px;right:-4px;background:var(--alert);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.app span.l{font-size:10.5px;color:var(--dim);text-align:center;}
.foot{margin-top:auto;text-align:center;font-size:11px;color:var(--dim);padding-top:14px;}
.appscreen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease;z-index:30;}
.appscreen.active{transform:translateX(0);}
.topbar{display:flex;align-items:center;gap:10px;padding:52px 16px 14px;border-bottom:1px solid rgba(255,255,255,.06);background:var(--panel);flex-shrink:0;}
.back{background:none;border:none;color:var(--accent);font-size:20px;padding:0 8px 0 0;cursor:pointer;}
.topbar h2{font-size:16px;margin:0;font-weight:600;}
.list{flex:1;overflow-y:auto;padding:8px 0;}
.list::-webkit-scrollbar,.chat::-webkit-scrollbar{display:none;}
.row{display:flex;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0;}
.row .m{flex:1;min-width:0;}
.row .n{font-size:13.5px;font-weight:600;}
.row .p{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .p.red{color:var(--alert);}
.row .t{font-size:10.5px;color:var(--dim);align-self:flex-start;}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px;}
.b{max-width:80%;padding:8px 12px;border-radius:16px;font-size:13px;line-height:1.4;}
.b.t{align-self:flex-start;background:var(--them);border-bottom-left-radius:4px;}
.b.m{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px;}
.b.c{box-shadow:0 0 0 1px var(--accent-dim);}
.st{font-size:9.5px;color:var(--dim);text-align:center;margin:4px 0;}
.who{font-size:10.5px;color:var(--accent);margin-bottom:-4px;margin-left:2px;}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--panel2);cursor:pointer;}
.pv{padding:16px;}
.big{width:100%;aspect-ratio:4/5;background:var(--panel2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:14px;}
.cap{font-size:12.5px;color:var(--dim);line-height:1.6;}
.cap b{color:var(--ink);}
.note{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.05);}
.note .nt{font-size:13.5px;font-weight:600;margin-bottom:3px;}
.note .nd{font-size:10.5px;color:var(--dim);margin-bottom:7px;}
.note .nb{font-size:12.5px;color:#cfdad9;line-height:1.6;white-space:pre-line;}
.note.lk .nb{filter:blur(5px);user-select:none;transition:filter .25s;}
.note.lk.open .nb{filter:none;}
.tip{font-size:11px;color:var(--accent);margin-top:6px;}
.it{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px;line-height:1.55;}
.it b{color:var(--accent);}
.it .tm{font-size:10.5px;color:var(--dim);margin-top:4px;}
.it .body{margin-top:6px;color:#cfdad9;}
.pinw{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:40px;}
.dots{display:flex;gap:14px;margin:18px 0 26px;}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--dim);}
.dot.on{background:var(--accent);border-color:var(--accent);}
.keys{display:grid;grid-template-columns:repeat(3,70px);gap:14px;}
.key{height:60px;border-radius:50%;background:var(--panel2);border:none;color:var(--ink);font-size:22px;font-family:inherit;cursor:pointer;}
.key.x{background:none;cursor:default;}
.shake{animation:sh .35s;}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>

<div class="frame"><div class="screen" id="scr">
<div class="notch"></div>
<div class="lock" id="lock">
  <div class="time">22:13</div>
  <div class="date">sexta-feira, 20 de setembro</div>
  <div class="warn">⚡ Sem energia na casa do lago desde 21:50. Tempestade forte. Estrada alagada.</div>
  <div class="hint">celular encontrado molhado na casa de barcos, 22:41. Sem senha: ela nunca trancava.</div>

</div>
<div class="home">

</div>

<script>
var scr=document.getElementById('scr'),stack=[],cur='';
function push(title,html,cls){
  var d=document.createElement('div');d.className='appscreen';
  d.innerHTML='<div class="topbar"><button class="back">‹</button><h2>'+title+'</h2></div><div class="'+(cls||'list')+'">'+html+'</div>';
  d.querySelector('.back').onclick=pop;scr.appendChild(d);
  requestAnimationFrame(function(){requestAnimationFrame(function(){d.classList.add('active');});});
  stack.push(d);return d;
}
function pop(){var d=stack.pop();if(!d)return;d.classList.remove('active');setTimeout(function(){d.remove();},300);}
var unlocked={},lockCtx=null;
function openLock(id,title,hint,password,onSuccess){
  cur='';var k='';
  for(var i=1;i<=9;i++)k+='<button class="key" onclick="pinTry('+i+')">'+i+'</button>';
  k+='<button class="key x"></button><button class="key" onclick="pinTry(0)">0</button><button class="key" onclick="pinDelG()">⌫</button>';
  lockCtx={password:password,onSuccess:onSuccess,id:id};
  push(title,'<div style="font-size:15px">Digite a senha</div><div class="cap" style="text-align:center;padding:6px 30px 0">'+hint+'</div><div class="dots" id="dotsG"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="keys">'+k+'</div>','pinw');
}
function pinTry(n){
  if(cur.length>=4)return;cur+=n;dotsG();
  if(cur.length===4){setTimeout(function(){
    if(cur===lockCtx.password){unlocked[lockCtx.id]=true;pop();cur='';renderApps();lockCtx.onSuccess();}
    else{var d=document.getElementById('dotsG');d.classList.add('shake');setTimeout(function(){d.classList.remove('shake');cur='';dotsG();},400);}
  },200);}
}
function pinDelG(){cur=cur.slice(0,-1);dotsG();}
function dotsG(){var e=document.querySelectorAll('#dotsG .dot');for(var i=0;i<e.length;i++)e[i].classList.toggle('on',i<cur.length);}
function tryOpen(id,title,hint,password,fn){ if(unlocked[id]) fn(); else openLock(id,title,hint,password,fn); }
var K={t:'b t',m:'b m',T:'b t c',M:'b m c'};
function chat(a){return a.map(function(x){
  if(x[0]==='s')return '<div class="st">'+x[1]+'</div>';
  return (x[2]?'<div class="who">'+x[2]+'</div>':'')+'<div class="'+K[x[0]]+'">'+x[1]+'</div>';}).join('');}
function rows(a,fn){return a.map(function(x,i){
  return '<div class="row" onclick="'+fn+'('+i+')"><div class="av" style="background:'+x.c+'">'+x.a+'</div><div class="m"><div class="n">'+x.n+'</div><div class="p '+(x.r?'red':'')+'">'+x.p+'</div></div><div class="t">'+x.t+'</div></div>';}).join('');}
function notes(a){return a.map(function(x){
  return '<div class="note'+(x.l?' lk" onclick="this.classList.toggle(\'open\')':'')+'"><div class="nt">'+(x.l?'🔒 ':'')+x.t+'</div><div class="nd">'+x.d+'</div><div class="nb">'+x.b+'</div>'+(x.l?'<div class="tip">toque pra revelar</div>':'')+'</div>';}).join('');}
function items(a){return a.map(function(x){
  return '<div class="it"><b>'+x.b+'</b>'+(x.x?'<div class="body">'+x.x+'</div>':'')+'<div class="tm">'+x.t+'</div></div>';}).join('');}
function photos(a,fn){return '<div class="grid">'+a.map(function(x,i){return '<div class="ph" onclick="'+fn+'('+i+')">'+x.e+'</div>';}).join('')+'</div>';}
function photoView(x){push(x.t,'<div class="big">'+x.e+'</div><div class="cap">'+x.c+'</div>','list pv');}
